<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="480" height="140">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1040;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b2a6b;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff7d6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#fff7d6;stop-opacity:0" />
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>

  <rect width="480" height="140" rx="16" fill="url(#sky)" />

  <!-- 星 1 -->
  <g>
    <circle cx="60" cy="35" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="1.5;3;1.5" dur="2.2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 星 2 -->
  <g>
    <circle cx="140" cy="22" r="2" fill="#ffd6e8">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="r" values="2;3.5;2" dur="1.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 星 3 -->
  <g>
    <circle cx="230" cy="30" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 星 4 -->
  <g>
    <circle cx="310" cy="18" r="2" fill="#ffe0b3">
      <animate attributeName="opacity" values="1;0.15;1" dur="2s" repeatCount="indefinite" />
      <animate attributeName="r" values="1.8;3.2;1.8" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 星 5 -->
  <g>
    <circle cx="390" cy="38" r="2" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 星 6 (右下) -->
  <g>
    <circle cx="440" cy="95" r="1.8" fill="#ffd6e8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 星 7 (左下) -->
  <g>
    <circle cx="45" cy="100" r="1.8" fill="#ffffff">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 月亮光晕 -->
  <circle cx="240" cy="70" r="52" fill="url(#moonGlow)" filter="url(#soft)">
    <animate attributeName="r" values="46;58;46" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" />
  </circle>

  <!-- 月亮 -->
  <circle cx="240" cy="70" r="30" fill="#fff7d6">
    <animate attributeName="r" values="29;31;29" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="252" cy="62" r="26" fill="#1a1040" opacity="0.85" />

  <!-- 月亮上的星星 -->
  <g>
    <circle cx="233" cy="66" r="1.5" fill="#f5c542">
      <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="242" cy="76" r="1" fill="#f5c542">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 流星 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;0.9;0" dur="6s" repeatCount="indefinite" keyTimes="0;0.65;0.72;0.8" />
    <line x1="60" y1="15" x2="110" y2="45" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
    <circle cx="110" cy="45" r="2" fill="#ffffff" />
  </g>

  <!-- 下划线装饰文字 -->
  <text x="240" y="126" text-anchor="middle" font-family="serif" font-size="14" fill="#d9c9ff" opacity="0.9">
    星月送来神的女儿，她原成为人的伴侣
  </text>
</svg>
